# ---------------------------------------------------------------------------
# Quota-resilience fallback chains (provider-qualified "provider:model").
# When a layer's primary model fails with ANY model API error (429 quota,
# 503 overload, 404 retired id), the run moves down its chain instead of
# failing. Chains deliberately cross models AND providers so no single
# quota or outage can take a run down. Keys here are roles/layers.
# ---------------------------------------------------------------------------

fallbacks:
  verifier:
    - google:gemini-3.1-flash-lite
    - anthropic:claude-haiku-4-5
    - openai:gpt-5.4-mini
  normalizer:
    - google:gemini-3.1-flash-lite
    - anthropic:claude-haiku-4-5
  orchestrator:
    - google:gemini-3.5-flash
    - anthropic:claude-sonnet-4-6
    - openai:gpt-5.4
  research:
    - google:gemini-2.5-flash
    - anthropic:claude-sonnet-4-6
    - openai:gpt-5.4
  planner:
    - google:gemini-2.5-pro
    - anthropic:claude-sonnet-4-6
    - openai:gpt-5.4
  filter:
    - google:gemini-3.1-flash-lite
    - anthropic:claude-haiku-4-5
    - openai:gpt-5.4-mini
