defaults:
  provider: google
  verifier: google
  normalizer: google
  orchestrator: google
  filter: google
  media_expert: google
  research: google

anthropic:
  orchestrator:
    model: claude-sonnet-4-6
    capabilities: [text, json, tools]
    task: "Central brain, tool routing, memory decisions, multi-step planning"
  code:
    model: claude-sonnet-4-6
    capabilities: [text, json, tools]
    task: "Code generation, refactoring, debugging"
  slop_detector:
    model: claude-haiku-4-5
    capabilities: [text, json]
    task: "AI slop detection via commit forensics and code pattern analysis"
  research:
    model: claude-sonnet-4-6
    capabilities: [text, json]
    task: "Web research, summarization"
  planner:
    model: claude-opus-4-8 # Most capable Opus tier for deep architectural planning
    capabilities: [text, json]
    task: "Architecture decisions, roadmaps, long-form reasoning"
  memory:
    model: claude-haiku-4-5
    capabilities: [text, json]
    task: "Memory compression, pruning, summarizing old entries"


openai:
  orchestrator:
    model: gpt-5.4
    capabilities: [text, json, tools]
    task: "Central brain, tool routing, memory decisions, multi-step planning"
  verifier:
    model: gpt-5.4-mini
    capabilities: [text, json, tools]
    task: "Input verification with structured output and optional tools"
  normalizer:
    model: gpt-5.4-mini
    capabilities: [text, json]
    task: "Target model profile for code-only normalizer decisions"
  filter:
    model: gpt-5.4-mini
    capabilities: [text, json]
    task: "Output safety filtering with structured output"
  code:
    model: gpt-5.4
    capabilities: [text, json, tools]
    task: "Code generation, refactoring, debugging"
  slop_detector:
    model: gpt-5.4-mini
    capabilities: [text, json]
    task: "AI slop detection via commit forensics and code pattern analysis"
  research:
    model: gpt-5.4
    capabilities: [text, json]
    task: "Web research, summarization"
  planner:
    model: gpt-5.4 # Configured with reasoning_effort="high" inside ModelSettings
    capabilities: [text, json]
    task: "Architecture decisions, roadmaps, long-form reasoning"
  memory:
    model: gpt-5.4-mini
    capabilities: [text, json]
    task: "Memory compression, pruning, summarizing old entries"


google:
  orchestrator:
    model: gemini-3.1-flash-lite # GA frontier-class; 3.5-flash is 503-congested at launch (June 2026) — swap back when it stabilizes
    capabilities: [text, json, tools, image, audio, video]
    task: "Central brain, tool routing, memory decisions, multi-step planning"
  verifier:
    model: gemini-2.5-flash-lite # separate per-model quota from the orchestrator
    capabilities: [text, json, tools]
    task: "Input verification with structured output and optional tools"
  normalizer:
    model: gemini-2.5-flash-lite
    capabilities: [text, json]
    task: "Target model profile for code-only normalizer decisions"
  filter:
    model: gemini-2.5-flash-lite # small fast gate; flash-lite has the most generous free-tier quota
    capabilities: [text, json]
    task: "Output safety filtering with structured output"
  media_expert:
    model: gemini-2.5-flash
    capabilities: [text, json, image, audio, video]
    task: "Fast multimodal understanding for normalizer/expert fallback"
  code:
    model: gemini-2.5-pro
    capabilities: [text, json, tools, image]
    task: "Code generation, refactoring, debugging"
  slop_detector:
    model: gemini-2.5-flash-lite
    capabilities: [text, json]
    task: "AI slop detection via commit forensics and code pattern analysis"
  research:
    model: gemini-3.5-flash # supports search grounding
    capabilities: [text, json, image]
    task: "Web research, summarization"
  planner:
    model: gemini-2.5-pro
    capabilities: [text, json, image, audio, video]
    task: "Architecture decisions, roadmaps, long-form reasoning"
  memory:
    model: gemini-2.5-flash-lite
    capabilities: [text, json]
    task: "Memory compression, pruning, summarizing old entries"


xai:
  orchestrator:
    model: grok-2-latest
    task: "Central brain, tool routing, memory decisions, multi-step planning"
  code:
    model: grok-2-latest
    task: "Code generation, refactoring, debugging"
  slop_detector:
    model: grok-2-latest
    task: "AI slop detection via commit forensics and code pattern analysis"
  research:
