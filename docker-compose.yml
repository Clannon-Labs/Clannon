services:
  vraksha:
    image: vraksha-runtime:latest
    build: .
    depends_on:
      - clamav
      - qdrant
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/vraksha
    env_file:
      - .env.local
    environment:
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - QDRANT_URL=http://qdrant:6333
      - VRAKSHA_EMBED_CACHE=/vraksha/assets/fastembed_cache
      - AGENT_YARA_DIR=/vraksha/rules
      - HF_HOME=/vraksha/assets/hf_cache
    stdin_open: true
    tty: true
    # interactive agent — never auto-restart: a restarting background copy
    # is exactly the stale old-code process the launcher then attaches to
    restart: "no"

  clamav:
    image: clamav/clamav:latest
    container_name: agent_clamav
    # Expose via internal TCP network to completely bypass cross-platform socket headaches.
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    # expose the port for host access (optional)
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  clamav_data:
  qdrant_storage:
