services:
  vraksha:
    image: vraksha-runtime:latest
    build: .
    depends_on:
      - clamav
      - qdrant
    volumes:
      # NOTE: the host docker socket is deliberately NOT mounted. Mounting it
      # grants this container host-root-equivalent control, and nothing uses it.
      # Out-of-process tool sandboxing (the python_exec TODO) must use a rootless
      # runtime or a socket proxy, never a raw socket mount.
      - .:/vraksha
    env_file:
      - .env.local
    environment:
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - QDRANT_URL=http://qdrant:6333
      - VRAKSHA_EMBED_CACHE=/vraksha/assets/fastembed_cache
      - AGENT_YARA_DIR=/vraksha/rules
      - HF_HOME=/vraksha/assets/hf_cache
    stdin_open: true
    tty: true
    # interactive agent — never auto-restart: a restarting background copy
    # is exactly the stale old-code process the launcher then attaches to
    restart: "no"

  clamav:
    image: clamav/clamav:latest
    container_name: agent_clamav
    # bound to loopback only: services reach it over the compose network by name;
    # 0.0.0.0 would put an unauthenticated daemon on every host interface
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    # loopback only — Qdrant has no auth and holds ALL user memory; it must never
    # be reachable from outside the host. Containers talk to it as http://qdrant:6333
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  clamav_data:
  qdrant_storage:
