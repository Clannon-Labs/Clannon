services:
  vraksha:
    image: vraksha-runtime:latest
    build: .
    depends_on:
      - qdrant
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/vraksha
    env_file:
      - .env.local
    environment:
      - HF_HOME=/vraksha/assets/hf_cache
    stdin_open: true
    tty: true

  qdrant:
    image: qdrant/qdrant:latest
    # expose the port for host access (optional)
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_storage:
