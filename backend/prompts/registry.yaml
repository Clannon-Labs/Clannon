# Prompt registry — the single index of every system/instruction prompt.
#
# Each entry maps a prompt name to its on-disk markdown file and a version tag.
# The version is stamped into stage results (e.g. flow.ctx.verifier_result
# metadata) so any model verdict can be traced back to the exact prompt that
# produced it.
#
# `locked: true` marks a security-boundary prompt (verifier, output filter).
# Locked prompts must never be overridable at runtime or by end users (see the
# SECURITY note in registry/config/prompts.py). At deploy, the real text of any
# prompt -- these AND each expert's co-located system.md + skills -- is supplied
# out-of-git via the auto-discovered `prompts.secure/` overlay (or
# VRAKSHA_PROMPTS_DIR). This manifest and its locked flags are ALWAYS read from
# here, never the overlay, so the overlay can never un-lock a prompt or add one.
#
# This registry holds the system-level / security-boundary prompts. Expert prompts
# are NOT here: each expert co-locates its system.md beside its code under
# core/orchestrator/experts/<name>/, loaded by the expert handler (an expert's
# prompt is part of its self-contained, unlocked capability).
#
# `about: true` composes the shared org/identity block (prompts/about_clannon.md)
# into a prompt at load time — edit that ONE file to change what the assistant knows
# about Clannon and the org behind it. Default-on for the orchestrator (the
# user-facing persona); leave it off for the security gates and internal agents.
#
# Batch orchestrators: there is NO single shared batch prompt. Each field's batch
# gets its own entry, named `batch_orchestrator.<batch_key>` (batch_key matches
# `batches.yaml` exactly), pointing at its own `batches/<batch_key>/orchestrator/
# system.md`. A batch's prompt carries that field's domain knowledge and is never
# reused across batches; `registry/config/batches.py` resolves each batch's prompt
# by its own key and fails closed (ConfigError) if a batch has no matching entry.

verifier:
  version: 2
  file: verifier/system.md
  locked: true

orchestrator:
  version: 6
  file: orchestrator/system.md
  locked: false   # persona/behavior is customizable later; not a security boundary
  about: true     # compose the shared org/identity block (prompts/about_clannon.md) in

batch_orchestrator.engineering:
  version: 1
  file: batches/engineering/orchestrator/system.md
  locked: false   # internal scoped behavior; overlay-aware, not a security boundary
  # one batch orchestrator per field -- this batch's prompt carries engineering's
  # own domain knowledge and is NOT shared with any other batch's prompt

filter:
  version: 1
  file: filter/system.md
  locked: true   # output safety/quality gate — a security boundary

memory:
  version: 2
  file: memory/system.md
  locked: false   # the memory-distillation agent — behavior, not a security boundary

memory_supersession:
  version: 1
  file: memory/supersession.md
  locked: false   # EB1 judge: does memory NEW replace memory EXISTING — behavior, not a security boundary

memory_entities:
  version: 1
  file: memory/entities.md
  locked: false   # CB2/CB3 graph-twin extractor — behavior, not a security boundary

memory_contradiction:
  version: 1
  file: memory/contradiction.md
  locked: false   # §3.2 contradiction judge — behavior, not a security boundary
