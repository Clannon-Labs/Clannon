# Prompt registry — the single index of every system/instruction prompt.
#
# Each entry maps a prompt name to its on-disk markdown file and a version tag.
# The version is stamped into stage results (e.g. flow.ctx.verifier_result
# metadata) so any model verdict can be traced back to the exact prompt that
# produced it.
#
# `locked: true` marks a security-boundary prompt (verifier, output filter).
# Locked prompts must never be overridable at runtime or by end users — see the
# SECURITY note in foundation/config/prompt_registry.py.
#
# This registry holds the system-level / security-boundary prompts. Expert prompts
# are NOT here: each expert co-locates its system.md beside its code under
# core/orchestrator/experts/<name>/, loaded by the expert handler (an expert's
# prompt is part of its self-contained, unlocked capability).

verifier:
  version: 2
  file: verifier/system.md
  locked: true

orchestrator:
  version: 2
  file: orchestrator/system.md
  locked: false   # persona/behavior is customizable later; not a security boundary

filter:
  version: 1
  file: filter/system.md
  locked: true   # output safety/quality gate — a security boundary

