# ─────────────────────────────────────────────────────────────────────────────
# config/backend/pricing.yaml — per-model LLM cost, for the real-cost margin budget.
# BACKEND-CONTROLLED. Rates are in MICRO-DOLLARS PER TOKEN (µ$/token; µ$ = USD × 1e6),
# e.g. a model at $3.00 per 1M input tokens → 3.0 µ$/token input.
#
# ‼️ PLACEHOLDER PRICES — NEVER ENABLE BUDGET ENFORCEMENT WITH THIS TABLE.
# Official direct-provider rates were audited 2026-07-28, but cannot be copied safely:
# production pricing has prompt-length tiers, modality rates, cache writes/reads,
# effective dates, and provider tool charges. Runtime currently retains only aggregate
# input/output tokens and may settle a fallback call against its configured primary.
# Fix that accounting model first, then replace every rate and cover every enabled route.
# The loader is FAIL-CLOSED: a model with no entry blocks when enforcement is active.
# ─────────────────────────────────────────────────────────────────────────────

